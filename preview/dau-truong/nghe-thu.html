<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nghe thử tiếng pet</title>
<style>
  :root { --bg: #15100c; --card: #241a12; --line: #3d2c1d; --text: #f3e6cf; --dim: #a8957a; --gold: #ffd36e; --bad: #ff6a5a; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 14px; }
  .he { margin: 18px 0 6px; color: var(--gold); font-weight: 600; }
  .pet { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  .pet.bad { border-color: var(--bad); }
  .ten { width: 150px; font-weight: 600; }
  .cry { width: 100%; color: var(--dim); font-size: 12px; }
  button { background: #3a2a1a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--gold); }
  button.flag { margin-left: auto; }
  .pet.bad button.flag { background: var(--bad); color: #000; }
  #out { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--line); margin-top: 12px; }
  textarea { width: 100%; height: 54px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; box-sizing: border-box; }
</style>
</head>
<body>
<h1>Nghe thử tiếng pet</h1>
<p>Bấm từng nút để nghe. Con nào nghe không hợp thì bấm "Không hợp", rồi copy dòng ở cuối trang gửi lại.</p>
<div id="list"></div>
<div id="out"><textarea id="txt" readonly placeholder="Các con bị đánh dấu sẽ hiện ở đây"></textarea></div>
<script>
const HE = { hoa: 'Hỏa', moc: 'Mộc', thuy: 'Thủy', tho: 'Thổ', kim: 'Kim' };
const KINDS = [['j', 'J'], ['k', 'K'], ['l', 'L'], ['trung', 'Trúng'], ['nang', 'Trúng nặng'], ['gong', 'Gồng ult'], ['ult', 'Ult nổ'], ['dau', 'Bị đánh'], ['nga', 'Gục']];
const ctx = new (window.AudioContext || window.webkitAudioContext)(), cache = {}, bad = new Set();
async function play(name) {
  ctx.resume();
  if (!cache[name]) cache[name] = await fetch('sfx/pet/' + name + '.ogg').then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));
  const s = ctx.createBufferSource(); s.buffer = cache[name]; s.connect(ctx.destination); s.start();
}
fetch('sfx/pet/_cry.json').then(r => r.json()).then(pets => {
  const list = document.getElementById('list');
  for (const he of Object.keys(HE)) {
    const h = document.createElement('div'); h.className = 'he'; h.textContent = HE[he]; list.append(h);
    for (const [dir, p] of Object.entries(pets).filter(([, p]) => p.he === he)) {
      const row = document.createElement('div'); row.className = 'pet';
      row.innerHTML = `<span class="ten">${dir}</span>`;
      for (const [k, label] of KINDS) { const b = document.createElement('button'); b.textContent = label; b.onclick = () => play(dir + '_' + k); row.append(b); }
      const f = document.createElement('button'); f.className = 'flag'; f.textContent = 'Không hợp';
      f.onclick = () => { bad.has(dir) ? bad.delete(dir) : bad.add(dir); row.classList.toggle('bad');
        document.getElementById('txt').value = bad.size ? 'Tiếng không hợp: ' + [...bad].join(', ') : ''; };
      row.append(f);
      const c = document.createElement('div'); c.className = 'cry'; c.textContent = `tiếng lớn: ${p.big} · tiếng ngắn: ${p.small} · cao độ ×${p.pitch}`; row.append(c);
      list.append(row);
    }
  }
});
</script>
</body>
</html>
