  return new Promise(ok => {
    const im = new Image();
    im.onload = () => { IMG[name] = im; ok(); };

    if (btn === 'UP') c.i = (c.i + n - 4) % n; if (btn === 'DOWN') c.i = (c.i + 4) % n;
    if (btn === 'B') return fadeTo(() => { S.mode = 'act'; });

    if (!slots) return toast('Thiếu: ' + d.need.filter((k, j) => !ingSlots({ need: d.need.slice(0, j + 1) })).map(ingName).join(', '));

// the drawn part of a picture (frames carry empty space around the pet), measured once
const BOX = new Map();
function inked(im) {
  if (BOX.has(im)) return BOX.get(im);
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const a = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++)
    if (a[(y * c.width + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const b = x1 < 0 ? [0, 0, im.width, im.height] : [x0, y0, x1 - x0 + 1, y1 - y0 + 1];
  BOX.set(im, b); return b;
}
// a picture fitted into a slot: its drawn part scaled into maxW x maxH and centred on (cx, cy)

// ---------- evolution ----------
function inRange(ms, k) { return ms >= EVO[k][0] && ms < EVO[k][1]; }
function frac(ms, k) { return (ms - EVO[k][0]) / (EVO[k][1] - EVO[k][0]); }
function drawEvo(now) {
  const ms = now - S.t0, CX = 320, FY = 330;
  const bright = ms < EVO.calm[1] ? 0.45 - 0.25 * frac(ms, 'calm') : 0.2;
  ctx.drawImage(IMG.nen, 0, 0);
  ctx.fillStyle = `rgba(0,0,0,${bright})`; ctx.fillRect(0, 0, 640, 480);
  for (const p of parts) {
    const y = ((p.y - ms * p.v) % 420 + 420) % 420 + 30;
    ctx.globalAlpha = 0.8; ctx.drawImage(IMG[p.img], p.x, y, 14, 14 * IMG[p.img].height / IMG[p.img].width); ctx.globalAlpha = 1;
  }
  const before = S.evoFrom, after = S.evoTo, idle = sample(BOUNCE, now);
  if (ms < EVO.swirl[0]) drawPet(before, idle, CX, FY);
  else if (inRange(ms, 'swirl')) {
    const k = frac(ms, 'swirl'), box = drawPet(before, idle, CX, FY, 0.95 * k, 0.9);
    const v = IMG[`xoay_${EL()}_${Math.floor(ms / 70) % 4}`], h = 70 + 70 * k, w = v.width * h / v.height * 1.6;
    ctx.drawImage(v, CX - w / 2, box.y + box.h * 0.55 - h / 2, w, h);
  } else if (inRange(ms, 'pillar')) {
    drawPet(before, idle, CX, FY, 1, 1);
    const c = IMG[Math.floor(ms / 60) % 2 ? 'cot-set' : 'cot-sang'], h = 420, w = c.width * h / c.height;
    ctx.drawImage(c, CX - w / 2, FY + 30 - h, w, h);
  } else if (inRange(ms, 'flash')) {
    const n = IMG['no-sang'], s = 460;
    ctx.drawImage(n, CX - s / 2, FY - 80 - s / 2, s, s);
    ctx.fillStyle = `rgba(255,255,245,${0.5 + 0.5 * frac(ms, 'flash')})`; ctx.fillRect(0, 0, 640, 480);
  } else {
    const k = inRange(ms, 'reveal') ? 1 - frac(ms, 'reveal') : 0;
    if (k > 0.4) {
      const r = IMG['vong-song'], w = 120 + 300 * (1 - k), h = r.height * w / r.width;
      ctx.drawImage(r, CX - w / 2, FY - 6 - h / 2, w, h);
    }
    drawPet(after, idle, CX, FY, 0.9 * k, k > 0 ? 0.8 : 0);
    if (k > 0) { ctx.fillStyle = `rgba(255,255,245,${0.6 * k})`; ctx.fillRect(0, 0, 640, 480); }
    if (ms >= EVO.banner[0]) {
      const b = IMG['bang-ron'], by = Math.round(-130 + 150 * ease((ms - EVO.banner[0]) / T.banner));
      ctx.drawImage(b, CX - b.width / 2, by);
      if (ms > EVO.banner[0] + 250) title('TIẾN HÓA!', CX, by + b.height * 0.58, 32, '#ffecaa', 5);
      if (ms > EVO.banner[0] + 550) {
        text(`${DATA.creature_name}  →  ${DATA.stages[after].name}`, CX, FY + 40, 18, '#ffecaa', 'center', true, 4);
        text(`Lv ${LV[after][0]}   ·   ${UNLOCK[after].replace('Hỏa', HE_NAME[EL()])}`, CX, FY + 66, 13, '#ffd28c', 'center', true, 3);
      }
      if (ms > EVO.banner[0] + 1100) {
        S.waitA = true;
        if (Math.floor(now / 450) % 2) text('A: tiếp tục', CX, 452, 14, '#f0e4ce', 'center', true, 3);
      }
    }
  }
}

// ---------- input ----------
function act(anim, extra = {}) { S.act = { anim, ...extra }; S.actT = performance.now(); }
const has = anim => !!DATA.stages[S.stage].anims[anim];
// the pet's most hated food (bag text says "món ghét"): it turns it down and keeps it in the bag
const hated = () => HATED_BY[EL()];
function comeHome() { S.mode = 'room'; S.walk = null; if (has('greet')) act('greet'); else if (has('wave')) act('wave', { loops: 2 }); }
function press(btn) {
  if (S.fade > 0) return;
  const now = performance.now();
  if (S.mode === 'title') {
    if (btn === 'UP' || btn === 'DOWN') S.titleSel ^= 1;
    if (btn === 'A' || btn === 'START') {
      if (S.titleSel === 1) toast('Chưa có bản lưu');
      else fadeTo(() => { S.mode = 'pickEgg'; S.pickEl = 0; });
    }
    return;
  }
  if (S.mode === 'pickEgg') {
    if (btn === 'LEFT' || btn === 'UP') S.pickEl = (S.pickEl + 4) % 5;
    if (btn === 'RIGHT' || btn === 'DOWN') S.pickEl = (S.pickEl + 1) % 5;
    if (btn === 'B') fadeTo(() => { S.mode = 'title'; });
    if (btn === 'A') openPickPet(ELS[S.pickEl]);
    return;
  }
  if (S.mode === 'pickPet') {
    const n = S.pickList.length;
    if (btn === 'LEFT') S.pickPet = (S.pickPet + n - 1) % n;
    if (btn === 'RIGHT') S.pickPet = (S.pickPet + 1) % n;
    if (btn === 'UP' && S.pickPet >= 4) S.pickPet -= 4;
    if (btn === 'DOWN' && S.pickPet + 4 < n) S.pickPet += 4;
    if (btn === 'B') S.mode = 'pickEgg';
    if (btn === 'A' && S.pickReady) {
      const c = S.pickList[S.pickPet];
      loadCreature(c.id);
      fadeTo(() => { S.mode = 'egg'; S.egg = { taps: 0, tapT: 0, hatchT: 0 }; });
    }
    return;
  }
  if (S.mode === 'egg') {
    if (btn !== 'A') return;
    const e = S.egg;
    if (!e.hatchT) { e.taps = Math.min(5, e.taps + 1); e.tapT = now; if (e.taps >= 5 && PET_READY) e.hatchT = now; }
    else if (now - e.hatchT > 1800) fadeTo(() => {
      const t = performance.now();
      Object.assign(S, { mode: 'room', t0: t, playT0: t, nextPoop: t + 30000, bubble: 'bong_vui', nextWalk: t + 3500,
                         lk: Object.fromEntries(ELS.map(h => [h, h === EL() ? 12 : 4])) });
      if (has('greet')) act('greet');
      toast(`Chào ${DATA.pet.name}! Chăm bé thật tốt nhé`);
    });
    return;
  }
  if (S.mode === 'bath') return;                             // the bath plays to its end
  if (S.mode === 'act') return actInput(btn);
  if (S.mode === 'fish') return fishInput(btn, now);
  if (S.mode === 'farm') return farmInput(btn, now);
  if (S.mode === 'seedShop') return seedShopInput(btn);
  if (S.mode === 'cook') return cookInput(btn, performance.now());
  if (S.mode === 'tui') return tuiInput(btn);
  if (S.mode === 'school') return schoolInput(btn, performance.now());
  if (S.mode === 'end') {
    if (btn === 'A' && now - S.endT > 1500) fadeTo(() => { S.mode = 'room'; });
    return;
  }
  if (S.mode === 'evo') {
    if (S.waitA && btn === 'A')
      fadeTo(() => {
        const st = S.evoTo;
        Object.assign(S, { mode: st === 'legend' ? 'end' : 'room', stage: st, level: LV[st][0], xp: 0, bubble: 'bong_tim',
                           act: null, walk: null, px: 320, endT: performance.now(), faceUs: false, turnT: 0 });
        if (st === 'teen') S.open[EL()] = true;
        S.coins += 1000;
        if (st === 'adult') { S.ngoc++; toast('Nhận 1 Ngọc Hồn (bản demo: thay cho đánh boss) · +1000 vàng'); }
        else toast('Tiến hóa xong: +1000 vàng');
      });
    return;
  }
  if (S.mode === 'map') {
    if (['UP', 'DOWN', 'LEFT', 'RIGHT'].includes(btn)) mapMove(btn);
    if (btn === 'B') fadeTo(comeHome);
    if (btn === 'A') {
      const p = PL[S.mapSel];
      if (p.kind === 'home') fadeTo(comeHome);
      else if (p.kind === 'shop') fadeTo(() => { S.mode = 'shop'; S.tab = 0; S.item = 0; });
      else if (p.kind === 'train') {
        if (S.stage === 'baby') toast('Tiến hóa lên Nhi để mở Tập luyện');
        else if (S.sick || S.need.nl < 25) toast(`${DATA.pet.name} ${S.sick ? 'đang ốm' : 'mệt quá'}, về nghỉ đã`);
        else fadeTo(() => {
          S.mode = 'room'; S.need.nl = Math.max(0, S.need.nl - 20); S.need.no = Math.max(0, S.need.no - 10);
          act('train', { loops: 3 }); emote('bc_mo-hoi-nho'); gainExp(55); S.bubble = 'tt_khat'; toast('Tập ở Võ đường xong: EXP +55');
        });
      }
      else if (p.kind === 'school') fadeTo(() => openSchool('map'));
      else if (p.kind === 'region') toast(S.open[p.key] ? `${p.name}: đã mở (nội dung vùng làm sau)` : `${p.name}: đang khóa`);
      else toast(`${p.name}: chưa làm`);
    }
    return;
  }
  if (S.mode === 'shop') {
    const n = rowsOf(S.tab).length;
    if (btn === 'LEFT' && S.item % 4) S.item--;
    if (btn === 'RIGHT' && S.item % 4 < 3 && S.item + 1 < n) S.item++;
    if (btn === 'UP' && S.item >= 4) S.item -= 4;
    if (btn === 'DOWN' && S.item + 4 < n) S.item += 4;
    if (btn === 'L1' || btn === 'R1') { S.tab = (S.tab + (btn === 'R1' ? 1 : SH.tabs.length - 1)) % SH.tabs.length; S.item = 0; }
    if (btn === 'A') buy();
    if (btn === 'X') toast('Bán: chưa làm');
    if (btn === 'B') fadeTo(() => { S.mode = 'map'; });
    return;
  }
  if (S.stats !== null) {                                     // the stats screen
    if (S.stats === 2 && S.gemMode) return gemInput(btn);
    if (S.stats === 2 && btn === 'A') { S.gemMode = 'sock'; return; }
    if (['LEFT', 'UP', 'L1'].includes(btn)) S.stats = (S.stats + 3) % 4;
    if (['RIGHT', 'DOWN', 'R1'].includes(btn)) S.stats = (S.stats + 1) % 4;
    if (btn === 'B' || btn === 'SELECT') S.stats = null;
    if (btn === 'A' && S.stats === 3) toast('Đổi tên: chưa làm');
    return;
  }
  if (S.popupGoal === 1) {                                    // the evolve panel
    if (btn === 'A') {
      S.popupGoal = 0;
      if (!conds().every(c => c[1])) return;
      S.evoFrom = S.stage; S.evoTo = nextStage(); S.night = S.nightGoal = 0;
      fadeTo(() => { S.mode = 'evo'; S.t0 = performance.now(); S.waitA = false; });
    }
    if (btn === 'B') S.popupGoal = 0;
    return;
  }
  if (S.pickerGoal === 1) {                                   // the bag
    const n = S.view.length;
    if (btn === 'LEFT' || btn === 'UP') S.pick = (S.pick + n - 1) % n;
    if (btn === 'RIGHT' || btn === 'DOWN') S.pick = (S.pick + 1) % n;
    if (btn === 'B') S.pickerGoal = 0;
    if (btn === 'A') {
      const k = S.view[S.pick];
      if (!S.bag[k]) { toast('Hết món này rồi'); return; }
      const it = S.items[k], food = it.file;
      if (it.use) { useItem(k); return; }
      S.pick = k;                                              // below, S.pick is the item's own index
      if (food === hated() && has('refuse')) {
        S.pickerGoal = 0; S.need.vui = Math.max(0, S.need.vui - 10); S.bubble = 'bong_gian'; S.tim = Math.max(0, S.tim - 0.2);
        act('refuse'); emote('bc_xi-khoi'); toast(`${DATA.pet.name} không chịu ăn ${S.items[S.pick].name}`); return;
      }
      S.bag[S.pick]--; S.pickerGoal = 0; S.bubble = food.startsWith(FOOD_PREFIX[EL()]) ? 'bong_tim' : 'bong_vui';
      if (!S.bag[S.pick]) {                                   // the last one: it leaves the bag
        S.items.splice(S.pick, 1); S.bag.splice(S.pick, 1); S.pick = Math.min(S.pick, Math.max(0, S.items.length - 1));
      }
      S.need.no = Math.min(100, S.need.no + 25); S.tim = Math.min(5, S.tim + 0.1); gainExp(25);
      const he = HE_KEY[it.he]; if (he) S.lk[he] = Math.min(100, S.lk[he] + 6);       // food feeds its element's Linh khí
      S.nextPoop = Math.min(S.nextPoop, now + 15000);
      act('eat', { food, loops: 3 });
      if (S.mess.length < 4) S.mess.push({ x: S.px + (S.left ? -1 : 1) * 64, y: FEET_Y + 14, img: 'san_vun-do-an' });
    }
    return;
  }
  if (S.night > 0.5 && btn !== 'A') return;
  if (btn === 'LEFT' || btn === 'UP') S.cursor = (S.cursor + MENU.length - 1) % MENU.length;
  if (btn === 'RIGHT' || btn === 'DOWN') S.cursor = (S.cursor + 1) % MENU.length;
  if (btn === 'START') toast('Trang trí phòng: chưa làm');
  if (btn === 'SELECT') { S.stats = 0; S.pickerGoal = 0; return; }
  if (btn === 'L2') {                                        // demo: fast-forward a quarter of the stage
    if (atCap()) { S.askedKey = null; return; }              // at the cap it opens the evolve panel again
    if (S.stage === 'legend' && S.level >= LV.legend[1]) return toast('Đã đạt cấp tối đa');
    gainExp(STAGE_EXP[S.stage] / 4); S.lk[EL()] = Math.min(100, S.lk[EL()] + 8); S.tim = Math.min(5, S.tim + 0.6);
    toast(`Tua nhanh: Lv ${S.level}`); return;
  }
  if (btn === 'Y') {                                         // show off a move, if this stage has any
    const a = DATA.stages[S.stage].anims, moves = ['punch', 'blast', 'attack', 'victory', 'run'].filter(m => a[m]);
    if (!moves.length) { toast('Bậc này chưa có chiêu'); return; }
    S.move = ((S.move || 0) + 1) % moves.length; act(moves[S.move], { loops: moves[S.move] === 'run' ? 3 : 2 }); return;
  }
  if (btn === 'X') {
    S.pokes = (S.pokes || []).filter(t => now - t < 2500).concat(now);
    if (S.pokes.length >= 4 && has('angry')) {
      S.pokes = []; S.need.vui = Math.max(0, S.need.vui - 5); S.bubble = 'bong_gian'; act('angry', { loops: 2 }); emote('bc_gian');
      S.tim = Math.max(0, S.tim - 0.3);
      toast(`${DATA.pet.name} bực rồi, đừng vuốt nữa!`);
    } else if (has('petted')) {
      if (!S.act || S.act.anim !== 'petted') act('petted', { loops: 2 }); else S.actT = now;
      S.need.vui = Math.min(100, S.need.vui + 3); S.bubble = 'bong_tim'; emote(Math.random() < 0.5 ? 'bc_tim' : 'bc_tim-nho'); S.tim = Math.min(5, S.tim + 0.08); gainExp(4);
    } else toast('Bậc này chưa có động tác vuốt ve');
    return;
  }
  if (['L1', 'R1', 'F'].includes(btn)) toast(`Nút ${btn}: chưa dùng ở màn này`);
  if (btn === 'R2') {                                        // play with the pet
    if (S.sick) { emote('bc_choang'); return toast(`${DATA.pet.name} đang ốm, không chơi được`); }
    if (S.need.nl < 10) { emote('bc_mo-hoi'); return toast(`${DATA.pet.name} mệt quá, cho ngủ đã`); }
    S.need.vui = Math.min(100, S.need.vui + 20); S.need.nl = Math.max(0, S.need.nl - 6); S.tim = Math.min(5, S.tim + 0.25);
    S.playedT = now; S.bubble = 'bong_vui'; emote(Math.random() < 0.5 ? 'bc_not-nhac' : 'bc_not-nhac-doi'); act('happy', { loops: 2, toy: Math.floor(Math.random() * 3) }); gainExp(20); return;
  }
  if (btn !== 'A') return;
  if (S.night > 0.5) {                                       // any A wakes it; a real nap gives EXP
    S.nightGoal = 0; S.act = null; S.bubble = null;
    if (now - S.sleepT > 4000) { gainExp(30); toast(`${DATA.pet.name} ngủ dậy khỏe re! EXP +30`); }
    if (has('wake')) act('wake', { loops: 1 });
    return;
  }
  switch (S.cursor) {
    case 0: openBag('food'); break;
    case 1:
      S.sparkle = now; S.sweepT = now;
      S.mess = [];
      if (S.poops.length) { emote('bc_tim-nho'); S.poops = []; S.need.sach = Math.min(100, S.need.sach + 45); gainExp(15); toast('Dọn sạch phân rồi!'); }
      else { S.need.sach = Math.min(100, S.need.sach + 25); gainExp(5); toast('Phòng sạch bong!'); }
      break;
    case 2: openBag('care'); break;
    case 3: S.nightGoal = 1; S.bubble = null; S.sleepT = now; act('sleep', { hold: true }); break;
    case 4: fadeTo(() => { S.mode = 'act'; S.actSel = 0; }); break;
    case 5: fadeTo(openMap); break;
  }
}
let fadeCb = null, fadeStart = 0;
function fadeTo(cb) { fadeCb = cb; fadeStart = performance.now(); S.fade = 0.001; }
function restart() { S = NEW(); fadeCb = null; }
// R36S buttons: what each does here, and the PC key for it
const BTN = [
  ['UP', '▲ ▼ ◀ ▶', 'Di chuyển: nút menu, món ăn, địa điểm trên bản đồ, món ở chợ', 'Mũi tên'], ['DOWN'], ['LEFT'], ['RIGHT'],
  ['A', 'A', 'Chọn, xác nhận, tiến hóa, đánh thức, vào địa điểm, mua, khảm ngọc (trang Thuộc tính)', 'Enter · Space · Z'],
  ['B', 'B', 'Quay lại, đóng bảng, để sau (chợ → bản đồ → nhà)', 'Esc · X · Backspace'],
  ['X', 'X', 'Vuốt ve pet (vuốt liền 4 lần là nó cáu) · gỡ ngọc ở trang Thuộc tính', 'C'], ['Y', 'Y', 'Khoe chiêu: đấm, chưởng, thắng (bậc lớn)', 'V'],
  ['START', 'START', 'Màn tiêu đề: bắt đầu · trong phòng: trang trí (chưa làm)', 'S'], ['SELECT', 'SELECT', 'Mở / đóng màn chỉ số', 'Shift · E'],
  ['L1', 'L1 · R1', 'Đổi trang ở màn chỉ số, đổi mục ở chợ, đổi hạt giống ở nông trại', 'Q · W'], ['R1'], ['L2', 'L2', 'Bản demo: tua nhanh ¼ giai đoạn; ở mốc cấp thì mở bảng tiến hóa', '1'], ['R2', 'R2', 'Chơi với pet (vui tăng)', '2'],
  ['F', 'F', 'Chưa dùng (máy thật: phím hệ thống)', 'F']];
const KEYS = { arrowup: 'UP', arrowdown: 'DOWN', arrowleft: 'LEFT', arrowright: 'RIGHT', enter: 'A', ' ': 'A', z: 'A',
  escape: 'B', x: 'B', backspace: 'B', c: 'X', v: 'Y', s: 'START', shift: 'SELECT', e: 'SELECT', q: 'L1', w: 'R1', '1': 'L2',
  '2': 'R2', f: 'F' };
const legend = document.getElementById('legend');
for (const [b, label, what, key] of BTN) if (label) legend.insertAdjacentHTML('beforeend',
  `<tr data-row="${b}"><td>${label}</td><td>${what}</td><td class="key">${key}</td></tr>`);
const ROW = { DOWN: 'UP', LEFT: 'UP', RIGHT: 'UP', R1: 'L1' };
function hit(btn) {
  for (const el of document.querySelectorAll(`[data-b="${btn}"], [data-row="${ROW[btn] || btn}"]`)) {
    el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 160);
  }
  document.getElementById('last').textContent = 'Vừa bấm: ' + btn;
  press(btn);
}
const HELD = {};
addEventListener('keyup', e => { const b = KEYS[e.key.toLowerCase()]; if (b) HELD[b] = false; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) { if (!e.repeat) hit(KEYS[k]); HELD[KEYS[k]] = true; e.preventDefault(); }
  if (k === 'r') restart();
});
for (const el of document.querySelectorAll('[data-b]')) {
  el.addEventListener('pointerdown', () => { hit(el.dataset.b); HELD[el.dataset.b] = true; });
  for (const ev of ['pointerup', 'pointerleave']) el.addEventListener(ev, () => { HELD[el.dataset.b] = false; });
}
document.getElementById('btnR').onclick = restart;
// a game pad plugged into the PC (standard layout: 0 bottom, 1 right, 2 left, 3 top)
const PAD = { 0: 'A', 1: 'B', 2: 'X', 3: 'Y', 4: 'L1', 5: 'R1', 6: 'L2', 7: 'R2', 8: 'SELECT', 9: 'START',
              12: 'UP', 13: 'DOWN', 14: 'LEFT', 15: 'RIGHT' };
const padDown = {};
function pollPad() {
  for (const gp of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!gp) continue;
    for (const [i, name] of Object.entries(PAD)) {
      const id = gp.index + ':' + i, down = !!(gp.buttons[i] && gp.buttons[i].pressed);
      // a button already held when the pad is first seen (some virtual pads) counts only after a release
      if (id in padDown && down && !padDown[id]) hit(name);
      if (id in padDown && down !== padDown[id]) HELD[name] = down;
      padDown[id] = down;
    }
  }
}

// ---------- loop ----------
let last = 0;
const step = (v, goal, dt, ms) => v + Math.sign(goal - v) * Math.min(Math.abs(goal - v), dt / ms);
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  pollPad();
  // reaching the top level of a stage opens the evolve panel (again once its conditions are all met)
  if (S.mode === 'room' && S.stats === null && atCap() && S.popupGoal === 0 && S.pickerGoal === 0 && !S.act && S.fade === 0) {
    const key = S.stage + conds().every(c => c[1]);
    if (S.askedKey !== key) { S.askedKey = key; S.popupGoal = 1; }
  }
  if (S.mode === 'room' && S.stats === null && S.fade === 0) tickNeeds(dt, now);
  S.popup = step(S.popup, S.popupGoal, dt, 300);
  S.picker = step(S.picker, S.pickerGoal, dt, 220);
  S.night = step(S.night, S.nightGoal, dt, 900);
  if (S.night > 0.5) S.need.nl = Math.min(100, S.need.nl + dt / 120);
  if (S.mode === 'act') drawAct(now); else if (S.mode === 'fish') drawFish(now, dt); else if (S.mode === 'farm') drawFarm(now, dt); else if (S.mode === 'seedShop') drawSeedShop(now); else if (S.mode === 'cook') drawCook(now); else if (S.mode === 'tui') drawTui(now); else if (S.mode === 'school') drawSchool(now);
  else if (S.mode === 'title') drawTitle(now); else if (S.mode === 'egg') drawEgg(now);
  else if (S.mode === 'pickEgg') drawPickEgg(now); else if (S.mode === 'pickPet') drawPickPet(now); else if (S.mode === 'end') drawEnd(now);
  else if (S.mode === 'room' && S.stats !== null) drawStats(now); else if (S.mode === 'room') drawRoom(now);
  else if (S.mode === 'bath') drawBath(now); else if (S.mode === 'map') drawMap(now, dt); else if (S.mode === 'shop') drawShop(now); else drawEvo(now);
  if (S.toast && (S.stats !== null || ['map', 'shop', 'title', 'egg', 'end', 'bath', 'pickEgg', 'pickPet', 'act', 'fish', 'farm', 'seedShop', 'cook', 'tui', 'school'].includes(S.mode)) && now - S.toastT < 1800) { ctx.fillStyle = 'rgba(18,11,9,0.85)'; ctx.fillRect(140, 190, 360, 40); text(S.toast, 320, 210, 14, '#f0e4ce', 'center'); }
  if (S.fade > 0) {
    const t = (now - fadeStart) / 350;
    if (t >= 1 && fadeCb) { fadeCb(); fadeCb = null; fadeStart = now; }
    const a = fadeCb ? Math.min(1, t) : Math.max(0, 1 - (now - fadeStart) / 350);
    if (!fadeCb && a <= 0) S.fade = 0;
    ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, 640, 480);
  }
  requestAnimationFrame(frame);
}
Promise.all(jobs).then(() => loadCreature('hoa-ho')).then(() => { S.t0 = performance.now(); requestAnimationFrame(frame); });
</script></body></html>
